[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
description = "Local distribution of portable agent skills and project conventions"
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["platformdirs>=4,<5", "pydantic>=2,<3", "PyYAML>=6,<7", "typer>=0.16,<1"]

[project.scripts]
nexus = "nexus.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
